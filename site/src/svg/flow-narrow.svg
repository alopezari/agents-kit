<svg class="only-narrow" viewBox="0 0 320 418" role="img" aria-label="The flow as a vertical line: spec, build, review, validate, ship, which opens the pull request and waits for its CI, follow-pr only when you ask, merge by you after any optional checks (the flow ends here), then the deploy, which ship runs only when you ask">
<g class="fill-text" font-family="JetBrains Mono, monospace" font-size="14">
<line class="stroke-accent" x1="30" y1="20" x2="30" y2="332" stroke-width="2"></line>
<line class="stroke-dim" x1="30" y1="344" x2="30" y2="374" stroke-width="2" stroke-dasharray="3 4"></line>
<rect class="fill-bg stroke-accent" x="22" y="12" width="16" height="16" stroke-width="2"></rect><text x="54" y="25">spec</text>
<rect class="fill-bg stroke-accent" x="22" y="64" width="16" height="16" stroke-width="2"></rect><text x="54" y="77">build</text>
<rect class="fill-bg stroke-accent" x="22" y="116" width="16" height="16" stroke-width="2"></rect><text x="54" y="129">review</text><text class="fill-dim" x="210" y="129" font-size="12">stamp</text>
<rect class="fill-bg stroke-accent" x="22" y="168" width="16" height="16" stroke-width="2"></rect><text x="54" y="181">validate</text><text class="fill-dim" x="210" y="181" font-size="12">stamp</text>
<rect class="fill-bg stroke-accent" x="22" y="220" width="16" height="16" stroke-width="2"></rect><text x="54" y="233">ship</text><text class="fill-human" x="210" y="233" font-size="12">gated</text>
<rect class="fill-bg stroke-dim" x="22" y="272" width="16" height="16" stroke-width="2" stroke-dasharray="3 3"></rect><text x="54" y="285">follow-pr</text><text class="fill-dim" x="210" y="285" font-size="12">on request</text>
<rect class="fill-human stroke-human" x="22" y="324" width="16" height="16" stroke-width="2"></rect><text class="fill-human" x="54" y="337">merge · you</text>
<rect class="fill-bg stroke-dim" x="22" y="376" width="16" height="16" stroke-width="2" stroke-dasharray="3 3"></rect><text x="54" y="389">deploy</text><text class="fill-dim" x="210" y="389" font-size="12">ship, if asked</text>
</g>
</svg>
