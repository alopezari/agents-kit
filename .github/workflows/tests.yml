name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request replaces its older run; every push to main gets a group of its own, so none is
# cancelled or replaced while queued.
concurrency:
  group: tests-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  suite:
    # The kit targets macOS: launchd, BSD tools, Homebrew.
    runs-on: macos-latest
    timeout-minutes: 30
    # The two slowest sections get a runner each; rest is everything else, so a new section runs without editing this.
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: hooks
            sections: hooks
          - part: install
            sections: install
          - part: rest
            sections: --skip hooks install
    name: suite (${{ matrix.part }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # triage and the flow tests diff against earlier commits
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # Pi's own YAML parser checks the skills' frontmatter (tests/test_skill_frontmatter.mjs).
      - run: npm install -g @earendil-works/pi-coding-agent@0.87.1
      # The kit's Claude Code plugin is validated and tested with the claude CLI (tests/run.sh mods); no sign-in needed.
      - run: npm install -g @anthropic-ai/claude-code@2.1.288
      # The kit must live at ~/.agents.
      - run: ln -s "$GITHUB_WORKSPACE" "$HOME/.agents"
      - name: Install
        env:
          AGENTS_SKIP_LAUNCHD: 1 # a runner has no user session to load jobs into
        run: ~/.agents/install.sh --yes
      - name: Test
        env:
          AGENTS_SKIP_LAUNCHD: 1
          SECTIONS: ${{ matrix.sections }}
        run: ~/.agents/tests/run.sh $SECTIONS
