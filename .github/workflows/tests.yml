name: tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  suite:
    # The kit targets macOS: launchd, BSD tools, Homebrew.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # triage and the flow tests diff against earlier commits
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      # The kit must live at ~/.agents.
      - run: ln -s "$GITHUB_WORKSPACE" "$HOME/.agents"
      - name: Install
        env:
          AGENTS_SKIP_LAUNCHD: 1 # a runner has no user session to load jobs into
        run: ~/.agents/install.sh --yes
      - name: Test
        env:
          AGENTS_SKIP_LAUNCHD: 1
        run: ~/.agents/tests/run.sh
